name: research-and-prototype

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline reports, fingerprints and documentation links
        run: make reports-check
      - name: Check Python and installer syntax
        run: |
          python3 -m py_compile prototype/tools/*.py tests/*.py
          bash -n prototype/tools/setup_linux.sh

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Godot and GDScript checks
        run: |
          curl -fL --retry 2 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "5bccbed65a94b82c7c319fdb15719ee8113a6e503976cc54e16f1c61fe95f3d74e5e40b8449b5bb89ff7f424574c20af01a4f5ef08b389e4dc338b245185b0b9  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          pip install gdtoolkit==4.5.0
      - name: Import, parse, lint and smoke-test
        run: make check GODOT=Godot_v4.5.1-stable_linux.x86_64
      - name: Verify shaders and live reflection pixels with software OpenGL
        run: make render-check GODOT=Godot_v4.5.1-stable_linux.x86_64
